name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v1
    with:
      # `pnpm run checks` does not emit `dist/` or bundle the DMS frontend.
      extra-commands: |
        pnpm build
        pnpm frontend:verify
