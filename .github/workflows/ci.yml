name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v1
    with:
      # `pnpm run checks` typechecks without emitting; the build also checks
      # the declaration output that gets published. `frontend:verify` builds
      # and checks the DMS frontend bundle.
      extra-commands: |
        pnpm build
        pnpm frontend:verify
